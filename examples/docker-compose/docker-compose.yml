# MariaDB Galera Cluster + HAProxy — example stack for testing
# Connect to cluster: haproxy:3306 (single endpoint; HAProxy routes only to Synced nodes)
# Image: galeriadb/12.1:latest (see README)

services:
  galera1:
    image: galeriadb/12.1:latest
    build:
      context: ../../docker
      dockerfile: Dockerfile
    hostname: galera1
    environment:
      GALERIA_ROOT_PASSWORD: secret
      GALERIA_PEERS: galera1,galera2,galera3
      GALERIA_CLUSTER_NAME: galera_cluster
      GALERIA_BOOTSTRAP_CANDIDATE: galera1
    volumes:
      - galera1_data:/var/lib/mysql
    networks:
      galera_net:
        aliases:
          - galera1
    # No healthcheck override: the image ships a state-transfer-aware check
    # (GET /liveness on port 9200), while HAProxy uses GET / for readiness.

  galera2:
    image: galeriadb/12.1:latest
    hostname: galera2
    environment:
      GALERIA_ROOT_PASSWORD: secret
      GALERIA_PEERS: galera1,galera2,galera3
      GALERIA_CLUSTER_NAME: galera_cluster
      GALERIA_BOOTSTRAP_CANDIDATE: galera1
    volumes:
      - galera2_data:/var/lib/mysql
    networks:
      galera_net:
        aliases:
          - galera2

  galera3:
    image: galeriadb/12.1:latest
    hostname: galera3
    environment:
      GALERIA_ROOT_PASSWORD: secret
      GALERIA_PEERS: galera1,galera2,galera3
      GALERIA_CLUSTER_NAME: galera_cluster
      GALERIA_BOOTSTRAP_CANDIDATE: galera1
    volumes:
      - galera3_data:/var/lib/mysql
    networks:
      galera_net:
        aliases:
          - galera3

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "3306:3306"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - galera_net

networks:
  galera_net:
    driver: bridge

volumes:
  galera1_data:
  galera2_data:
  galera3_data:
